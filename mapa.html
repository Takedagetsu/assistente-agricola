<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa — Áreas e Visitas</title>
    
    <link rel="stylesheet" href="./Styles/estilos.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    
    <style>
        #mapa {
            height: 75vh;
            border-radius: var(--raio);
            border: 1px solid var(--borda);
            margin: 1rem 0;
        }
        .legenda-mapa {
            background: var(--fundo-card);
            padding: 1.25rem;
            border-radius: var(--raio);
            border: 1px solid var(--borda);
            margin-bottom: 1rem;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }
        .cor-visita { width: 14px; height: 14px; border-radius: 50%; background: var(--primaria); }
        .cor-talhao { width: 14px; height: 14px; border-radius: 50%; background: var(--sucesso); }
    </style>
</head>
<body>
    <script src="/js/firebase-config.js"></script>

    <!-- PROTEÇÃO CORRIGIDA -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const esperar = setInterval(() => {
                if (window.FIREBASE_AUTH) {
                    clearInterval(esperar);
                    FIREBASE_AUTH.verificarSessao(logado => {
                        if (!logado) {
                            const salvo = localStorage.getItem('sessao');
                            if (!salvo) {
                                window.location.href = 'login.html';
                                return;
                            }
                            window.usuarioLogado = JSON.parse(salvo);
                        }
                        inicializarMapa();
                    });
                }
            }, 100);
        });
    </script>

    <div class="container">
        <header class="cabecalho">
            <div class="cabecalho-esq">
                <h1>🗺️ Mapa de Áreas e Visitas</h1>
                <p class="subtitulo">Visualização georreferenciada</p>
            </div>
            <div class="cabecalho-dir">
                <button onclick="window.location.href='principal.html'" class="btn-secundario btn-sm">← Voltar</button>
                <button onclick="window.FIREBASE_AUTH.sair()" class="btn-perigo btn-sm" style="margin-left: 0.5rem;">Sair</button>
            </div>
        </header>

        <div class="legenda-mapa">
            <h4 style="margin-bottom: 0.8rem;">Legenda</h4>
            <div class="legenda-item">
                <span class="cor-visita"></span> Visitas Técnicas
            </div>
            <div class="legenda-item">
                <span class="cor-talhao"></span> Talhões / Áreas
            </div>
        </div>

        <div id="mapa"></div>
    </div>

    <script>
        let mapa;

        function inicializarMapa() {
            const visitas = JSON.parse(localStorage.getItem('visitas') || '[]');
            const talhoes = JSON.parse(localStorage.getItem('talhoes') || '[]');

            let latCentral = -15.7801;
            let lngCentral = -47.9292;
            let temCoordenada = false;

            for (const v of visitas) {
                if (v.latitude && v.longitude) {
                    latCentral = v.latitude;
                    lngCentral = v.longitude;
                    temCoordenada = true;
                    break;
                }
            }
            if (!temCoordenada) {
                for (const t of talhoes) {
                    if (t.lat && t.lng) {
                        latCentral = parseFloat(t.lat);
                        lngCentral = parseFloat(t.lng);
                        break;
                    }
                }
            }

            mapa = L.map('mapa').setView([latCentral, lngCentral], temCoordenada ? 13 : 5);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(mapa);

            visitas.forEach(visita => {
                if (!visita.latitude || !visita.longitude) return;
                const icone = L.divIcon({
                    html: `<div style="width:14px; height:14px; background:var(--primaria); border-radius:50%; border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.4);"></div>`,
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });
                L.marker([visita.latitude, visita.longitude], { icon: icone })
                    .addTo(mapa)
                    .bindPopup(`
                        <div style="min-width:220px;">
                            <h4 style="color:var(--primaria); margin:0 0 0.5rem;">📋 Visita</h4>
                            <p><strong>Cliente:</strong> ${visita.cliente || '-'}</p>
                            <p><strong>Talhão:</strong> ${visita.talhao || '-'}</p>
                            <p><strong>Data:</strong> ${visita.data || '-'}</p>
                            <p><strong>Status:</strong> ${visita.status === 'agendada' ? 'Agendada' : visita.status === 'andamento' ? 'Em Andamento' : 'Concluída'}</p>
                        </div>
                    `);
            });

            talhoes.forEach(t => {
                if (!t.lat || !t.lng) return;
                const icone = L.divIcon({
                    html: `<div style="width:14px; height:14px; background:var(--sucesso); border-radius:50%; border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.4);"></div>`,
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });
                L.marker([parseFloat(t.lat), parseFloat(t.lng)], { icon: icone })
                    .addTo(mapa)
                    .bindPopup(`
                        <div style="min-width:220px;">
                            <h4 style="color:var(--sucesso); margin:0 0 0.5rem;">🌿 Talhão</h4>
                            <p><strong>Nome:</strong> ${t.nome || '-'}</p>
                            <p><strong>Área:</strong> ${t.area ? t.area + ' ha' : '-'}</p>
                            <p><strong>Cultura:</strong> ${t.cultura || '-'}</p>
                            <p><strong>Proprietário:</strong> ${t.cliente || '-'}</p>
                        </div>
                    `);
            });

            setTimeout(() => mapa.invalidateSize(), 150);
        }
    </script>
</body>
</html>
