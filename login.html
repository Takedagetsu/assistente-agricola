<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafraTech — Login</title>
    <link rel="stylesheet" href="./Styles/estilos.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🌾 SafraTech</h1>
            <p>Sistema de Gestão de Visitas Técnicas</p>
            
            <div class="form-grupo">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seuemail@email.com">
            </div>
            
            <div class="form-grupo">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">
            </div>
            
            <button onclick="fazerLogin()">Entrar</button>
            <div id="mensagem-erro" class="mensagem-erro oculto">E-mail ou senha incorretos!</div>
        </div>
    </div>

    <script>
        const USUARIO_VALIDO = "admin@safratech.com";
        const SENHA_VALIDA = "123456";

        function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const msgErro = document.getElementById('mensagem-erro');

            if (email === USUARIO_VALIDO && senha === SENHA_VALIDA) {
                localStorage.setItem('safratech_logado', 'sim');
                window.location.href = 'principal.html';
            } else {
                msgErro.classList.remove('oculto');
            }
        }
    </script>
    <!-- Firebase + App (Versão Moderna) -->
<script type="module" src="js/config/firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
