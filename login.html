<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroManejo — Login</title>
    <link rel="stylesheet" href="./Styles/estilos.css">
</head>
<body class="pagina-login">
    <div class="fundo-dinamico"></div>
    <div class="grade-rede"></div>
    
    <div class="conteudo-wrapper login-wrapper">
        <div class="login-bloco">
            <div class="login-titulo">
                <div class="logo-icone" style="margin:0 auto;">🌾</div>
                <h1>AgroManejo</h1>
                <p>Sistema de Gestão de Visitas Técnicas</p>
            </div>
            
            <div class="erro-msg" id="erro-login" style="display:none;"></div>
            
            <div class="grupo-form">
                <label>E-mail</label>
                <input type="email" id="login-email" placeholder="seu@email.com">
            </div>
            <div class="grupo-form">
                <label>Senha</label>
                <input type="password" id="login-senha" placeholder="Digite sua senha">
            </div>
            <button class="btn-primario btn-largo" onclick="fazerLogin()">🔐 Entrar</button>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
